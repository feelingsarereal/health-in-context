  keys:
  - - N
    - new circumstance
  - - E
    - new link from the selection
  - - A
    - association menu
  - - 1 / 2
    - 1st / 2nd-degree neighbourhood
  - - L
    - loops panel
  - - R
    - auto-arrange
  - - P
    - pin / unpin
  - - Del
    - delete
  - - ⌘Z / ⌘⇧Z
    - undo / redo
  - - ⌘B / ⌘I / ⌘U
    - bold / italic / underline while editing text
  - - ← → ↑ ↓
    - move between circumstances
  - - Shift + arrows
    - nudge the selected circumstance (pins it)
  - - Enter
    - edit the selection
  - - Esc
    - clear the selection
  - - '?'
    - this list
