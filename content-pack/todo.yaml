- id: T-LIC-01
  what: Confirm the licence terms for reproducing ICD-11 titles and definitions in a public app (WHO ICD-11 licence) before
    any delivery other than local.
  status: 'checked 2026-11-02 against WHO''s ICD-11 Terms of Use and License Agreement (icd.who.int/en/docs/ICD11-license.pdf):
    CC BY-ND 3.0 IGO. Software may incorporate ICD-11 and carry code, title and URI (§1.2.2–1.2.3; 125/126 codes have a URI,
    QD71.Z links to the browser root). Added data fields are allowed if clearly marked as not from WHO (§1.2.5; the builder''s
    tiers and links are labelled). Required: the citation ''International Classification of Diseases, Eleventh Revision (ICD-11),
    World Health Organization (WHO) 2019 https://icd.who.int/browse11. Licensed under CC BY-ND 3.0 IGO'' (§1.3) — not yet
    shown in the app. No WHO name or emblem as endorsement (§4.1). DECIDED 2026-11-02 (Daniel): keep the crosswalk while the
    app stays local; Daniel wants the app public within 2–3 weeks (by about 2026-11-20). Plan: ask WHO for a written agreement
    now; if none by about 2026-11-16, ship with the ICD-10-CM line removed and the HP2030 domains kept as a builder topic
    tag. Background: §1.2.4 says mapping or crosswalks between ICD-11 and other classifications need a separate written agreement
    from WHO, and the app ships a proposed ICD-10-CM / HP2030 crosswalk (114 codes). Not legal advice.'
