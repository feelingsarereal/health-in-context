# scenarios.yaml — persona walkthroughs = acceptance (ACTION-SPEC §8). Each becomes a Playwright spec, and Daniel walks
# the same steps in the built app. Circumstances are invented teaching cases, not real people.
- id: w1
  persona: p-navigator
  title: "Map a client's housing–work loop and find it"
  starts_with: empty
  steps:
    - do: "Create a new map named 'Client R.' and set its subject to the label 'R.'"
      expect: "The de-identification nudge shows beside the subject field"
    - do: "Add a node, choose code QD71.1 Inadequate housing from the code picker, and describe 'Behind on rent; landlord filed for eviction'"
      expect: "The node shows the QD71 block colour and its code; the code pop-out shows the ICD-11 title, the 'no definition in ICD-11' state with the WHO link, and the interim-source note"
    - do: "Open the association menu on that node (right-click, or select it and press A)"
      expect: "Grouped 'Leads to' and 'Comes from' entries appear, each with polarity, evidence grade and a citation; 'Leads to' includes problems associated with employment or unemployment (L03); no withheld link is offered"
    - do: "Choose L03, pick QD80 Problem associated with unemployment, describe 'Missed shifts during the move; let go'"
      expect: "A new node appears linked from the housing node with a + edge carrying L03's citation"
    - do: "Add a node coded QD51 Low income, describe 'No paycheck since March', and draw an edge from the unemployment node to it, polarity +"
      expect: "A third node appears linked with a + edge; the edge has no citation because the user drew it"
    - do: "Draw an edge from the low-income node back to the housing node, polarity +, weight 0.75, description 'Can't make rent'"
      expect: "The edge appears with a + glyph at the arrowhead and a thicker line than the 0.5 default"
    - do: "Open the Loops panel"
      expect: "Exactly one loop is listed: R1, reinforcing, 3 nodes; clicking it highlights those nodes and edges and dims the rest"
  must_not:
    - "any wording that diagnoses the client or recommends a clinical action"
    - "any network request carrying text typed into the map"
- id: w2
  persona: p-student
  title: "Build a two-loop model, weight it, read the analyses and export"
  starts_with: empty
  steps:
    - do: "Add nodes coded QD80 (unemployment), QD51 (low income) and QE01 (stress), and one 'other' node of type outcome labelled 'Self-rated health'"
      expect: "The 'other' node has a neutral fill and dashed outline; no association menu is offered on it"
    - do: "Link QD80 → QD51 (+), QD51 → QE01 (+), QE01 → QD80 (+), and QE01 → Self-rated health (−)"
      expect: "Loop R1 (3 nodes) is detected; the link inventory lists three + links and one − link"
    - do: "Add an 'undetermined' node labelled 'Support from sister', link it → QE01 with polarity − weight −0.5, and QE01 → it with polarity − weight −0.25"
      expect: "A second loop is detected and labelled R (two − links multiply to +); the undetermined node shows a '?' badge and is listed under 'To code'"
    - do: "Open Paths and ask 'How does QD80 affect Self-rated health?'"
      expect: "At least one path is listed with its net sign (−) and the product of its weights"
    - do: "Open Leverage hints"
      expect: "A ranked table appears, labelled 'heuristic — hints for discussion'"
    - do: "Open the reference card behind any association citation"
      expect: "The card shows the tier, the summary, and the verbatim abstract labelled as such"
    - do: "Export the map as JSON, the edge list as CSV and the loop report as Markdown, then import the JSON into a new map"
      expect: "Three files download; the re-imported map has the same nodes, edges, weights, polarities and loop list"
  must_not:
    - "any loop strength or leverage result shown without its heuristic label"
    - "any network request after the app has loaded, other than a clicked external link"
- id: w3
  persona: p-caregiver
  title: "Sketch a relative's situation on a phone without knowing the codes"
  starts_with: empty
  viewport: 375x812
  steps:
    - do: "Create a map, add a node and leave its code status as 'undetermined', describing 'Mom's hours were cut'"
      expect: "The node is created without a code; the '?' badge shows; nothing forces a code"
    - do: "Use the code picker's search for 'job' on that node and choose QD82 Problem associated with threat of job loss"
      expect: "The node recodes and keeps its description"
    - do: "Long-press the node (or tap its ⋯ button) to open the association menu, and under 'Comes from' choose the housing link (L03) and the code QD71.1 Inadequate housing"
      expect: "The menu opens on touch, and a linked node is added upstream with L03's citation on the edge"
    - do: "Switch to the list view and edit the second node's description"
      expect: "The list view shows both nodes and the edge, and the edit is saved"
    - do: "Open Help"
      expect: "The help page lists 988, 211 and the National Domestic Violence Hotline, each with its source and the date it was checked"
    - do: "Use 'Clear my data' and confirm, then reload"
      expect: "No maps remain"
  must_not:
    - "any wording that diagnoses or advises treatment"
    - "any control that needs a mouse right-click with no touch alternative"
