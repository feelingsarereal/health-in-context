- id: w1
  persona: p-navigator
  title: Map a client's housing–work–income loop that closes on evidence, plus one deliberate override
  starts_with: empty
  steps:
  - do: Create a new map named 'Client R.' and set its subject to the label 'R.'
    expect: The de-identification nudge shows beside the subject field
  - do: Add a node, search the code picker for 'evict', choose QD71.Z Problems associated with housing, unspecified, and describe 'Behind
      on rent; landlord filed for eviction'
    expect: The picker shows QD71.Z for 'evict' with the note that ICD-11 has no eviction code; the node shows the QD71 block colour;
      the code pop-out shows the ICD-11 title, the 'no definition in ICD-11' state with the WHO link, and the interim-source note
  - do: Open the association menu on that node (right-click, or select it and press A)
    expect: '''Leads to'' lists L03 (problems associated with employment or unemployment), L27 (low income) and L28 (homelessness),
      each with polarity, grade and citation; no withheld link is offered'
  - do: Choose L03, pick QD80 Problem associated with unemployment, describe 'Missed shifts during the move; let go'
    expect: A new node appears with a + edge carrying L03's citation and no ⚑ flag
  - do: Open the association menu on the unemployment node, choose L01 and add QD51 Low income, described 'No paycheck since March'
    expect: A new node appears with a + edge carrying L01's citation (grade F) and no ⚑ flag
  - do: Open the association menu on the low-income node; under 'Leads to', L02 offers 'Link to' the existing housing node — choose
      it
    expect: 'An evidence edge (L02, no ⚑) joins the two existing nodes; the map header reads ''3 links: 3 evidence · 0 override'''
  - do: Open the Loops panel
    expect: 'Exactly one loop: R1, reinforcing, 3 links, 0 overrides; clicking it highlights the loop and dims the rest'
  - do: Turn on 'Evidence-backed links only'
    expect: R1 is still listed — the loop closes on evidence alone; no 'none can be' message appears
  - do: Add a node coded QE01 Stress ('Worried all the time') and drag from the low-income node's connector handle onto it
    expect: The link form says the link is not supported ('Evidence link L05 is withheld') and cannot be saved until an override is
      confirmed with a reason
  - do: Confirm the override with the reason 'Client describes constant money worry' and save with polarity +
    expect: 'The edge shows a mid-edge ⚑ flag with the reason in its tooltip; the header reads ''4 links: 3 evidence · 1 override'''
  must_not:
  - any wording that diagnoses the client or recommends a clinical action
  - any network request carrying text typed into the map
- id: w2
  persona: p-student
  title: Close a link through evidence, build a two-loop model with overrides, read the analyses and export
  starts_with: empty
  steps:
  - do: Add a node coded QE82.0 (personal history of physical abuse) and a node coded QD80 (unemployment), unlinked. Open the association
      menu on the QE82.0 node
    expect: Under 'Leads to', L20 offers 'Link to' the existing QD80 node as well as 'Add new'
  - do: Choose 'Link to' the existing QD80 node
    expect: An evidence edge (no ⚑) with L20's citation joins the two existing nodes; no new node is created
  - do: Add nodes coded QD51 (low income) and QE01 (stress), and one 'other' node of type outcome labelled 'Self-rated health'
    expect: The 'other' node has a neutral fill and dashed outline; no association menu is offered on it
  - do: Link QD80 → QD51 (+), QD51 → QE01 (+), QE01 → QD80 (+) and QE01 → Self-rated health (−), confirming an override with a reason
      wherever the form asks for one
    expect: Two of the four links ask for an override and show ⚑ (L05 is withheld; Self-rated health is not an SDOH code); QD80 → QD51
      is backed by L01 and QE01 → QD80 by L29, both with no ⚑; loop R1 (3 links, 1 override) is detected; the link inventory lists
      four + links and one − link
  - do: Link QE82.0 → QD51 (+)
    expect: The form says the link is outside L25's codes, which cover QE82.0 → QD50 (poverty) only, and asks for an override; once
      confirmed with a reason the edge shows ⚑ and no new loop appears
  - do: Add an 'undetermined' node labelled 'Support from sister', link it → QE01 with polarity − weight −0.5 and QE01 → it with polarity
      − weight −0.25, confirming the overrides
    expect: A second loop is detected and labelled R (two − links multiply to +); the undetermined node shows a '?' badge and is listed
      under 'To code'
  - do: Open Paths and ask 'How does QD80 affect Self-rated health?'
    expect: At least one path is listed with its net sign (−) and the product of its weights
  - do: Open Leverage hints
    expect: A ranked table appears, labelled 'heuristic — hints for discussion'
  - do: Open the reference card behind any association citation
    expect: The card shows the tier, the summary, and the verbatim abstract labelled as such
  - do: Export the map as JSON, the edge list as CSV and the loop report as Markdown, then import the JSON into a new map
    expect: Three files download; the re-imported map has the same nodes, edges, weights, polarities, bases, override reasons and loop
      list
  must_not:
  - any loop strength or leverage result shown without its heuristic label
  - any network request after the app has loaded, other than a clicked external link
- id: w3
  persona: p-caregiver
  title: Sketch a relative's situation on a phone without knowing the codes
  starts_with: empty
  viewport: 375x812
  steps:
  - do: Create a map, add a node and leave its code status as 'undetermined', describing 'Mom was laid off'
    expect: The node is created without a code; the '?' badge shows; nothing forces a code
  - do: Use the code picker's search for 'unemploy' on that node and choose QD80 Problem associated with unemployment
    expect: The node recodes and keeps its description
  - do: Long-press the node (or tap its ⋯ button) to open the association menu, and under 'Comes from' choose the housing link (L03)
      and the code QD71.Z Problems associated with housing, unspecified
    expect: The menu opens on touch, and a linked node is added upstream with L03's citation on the edge
  - do: Switch to the list view and edit the second node's description
    expect: The list view shows both nodes and the edge, and the edit is saved
  - do: Open Help
    expect: The help page lists 988, 211 and the National Domestic Violence Hotline, each with its source and the date it was checked
  - do: Use 'Clear my data' and confirm, then reload
    expect: No maps remain
  must_not:
  - any wording that diagnoses or advises treatment
  - any control that needs a mouse right-click with no touch alternative
