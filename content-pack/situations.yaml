- code: QE10
  title: Hazardous alcohol use
  group: QE10-QE2Z
  parent: null
  definition: A pattern of alcohol use that appreciably increases the risk of harmful physical or mental health consequences
    to the user or to others to an extent that warrants attention and advice from health professionals. The increased risk
    may be from the frequency of alcohol use, from the amount used on a given occasion, or from risky behaviours associated
    with alcohol use or the context of use, or from a combination of these. The risk may be related to short-term effects
    of alcohol or to longer-term cumulative effects on physical or mental health or functioning. Hazardous alcohol use has
    not yet reached the level of having caused harm to physical or mental health of the user or others around the user. The
    pattern of alcohol use often persists in spite of awareness of increased risk of harm to the user or to others.
  definition_check: diff_verified
  inclusions: []
  exclusions:
  - title: Disorders due to use of alcohol
    code: 6C40
