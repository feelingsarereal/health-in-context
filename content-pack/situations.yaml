known_gaps:
- 'WHO ICD-11 browser (icd.who.int/browse/2025-01/mms/en) was NOT readable: WebFetch got only the landing page shell (a JavaScript
  app); the GetConcept endpoint returned a client error. All data comes from the findacode.com mirror, release v2026-01.'
- The full MMS PDF (familysupport.org.za) could not be fetched (proxy HTTP 504), so it was not used.
- 'foundation_id: findacode does not print WHO URIs; IDs come from the numeric part of each findacode URL (block-<id>/code-<id>),
  which matches the WHO foundation entity ID as described in the task brief. Not checked against id.who.int (that API needs
  a token).'
- Residual Y/Z codes have no foundation_id (findacode serves them at code-<parent-id>/other.html or /unspecified.html); foundation_id
  is null for them.
- 'Description text: the fetch tool will not quote more than about 125 characters. Long descriptions were rebuilt and then
  checked against the page with a model-run, character-by-character comparison (''diff_verified'' = reported IDENTICAL; ''diff_corrected_not_reconfirmed''
  = small corrections taken from the comparison but not re-checked: QE03, QE94, QE96 and the QE10-QE1Z sub-block description).
  This was done by a language model, not a programmatic diff, so small typographic details (straight vs curly quotes, double
  spaces, dashes) may be wrong. Curly apostrophes were confirmed only in QD85 and QE50.7; QE92, QE94 and QE95 use straight
  apostrophes here and those were not confirmed.'
- Inclusions / exclusions / coded-elsewhere titles were read through the same summarising fetch tool. They are short and were
  asked for exactly, but no second fetch checked them character by character. Exclusion links (hrefs) were not kept; codes
  were.
- index_terms are findacode's 'synonyms' list (WHO index terms). For QE51.1 only 7 of about 47 terms are kept.
- 'Not captured: ''code also'' / ''use additional code'' notes, postcoordination axes, and coding notes. None were seen on
  the pages read, but the fetch prompts did not ask for them specifically.'
- 'Structure as findacode shows it: QE50 has no QE50.Z; QE61 has only QE61.0 and QE61.Y (no .Z); QE70 has no .Y; QD70 and
  QD71 have only .Z; QD6 has no QD6Y. These were not checked against WHO.'
- QE11.8 and QE11.9 have their own foundation entities, so they are listed as codes, not residuals.
- QE70 is a standalone category, not a block; it is listed as its own group with range 'QE70'.
- Block-level descriptions exist only for QF20-QF2Z and the QE10-QE1Z sub-block; the other blocks show none on findacode.
- 'Possible source oddity, recorded as found: the QD80-QD8Z block exclusion reads ''problems related to housing and economic
  circumstances (QD71)''.'
- QE62 Uncomplicated bereavement has no description on findacode v2026-01; recorded as null.
- The section (QD50-QF2Z, findacode block-57624301) has no description; QF00-QF0Z and QF10 are out of scope and left out.
