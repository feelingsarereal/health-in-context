- code: QD85
  title: Burnout
  group: QD80-QD8Z
  parent: null
  definition: 'Burnout is a syndrome conceptualized as resulting from chronic workplace stress that has not been successfully
    managed. It is characterised by three dimensions: 1) feelings of energy depletion or exhaustion; 2) increased mental distance
    from one’s job, or feelings of negativism or cynicism related to one’s job; and 3) a sense of ineffectiveness and lack
    of accomplishment. Burn-out refers specifically to phenomena in the occupational context and should not be applied to
    describe experiences in other areas of life.'
  definition_check: diff_verified
  inclusions: []
