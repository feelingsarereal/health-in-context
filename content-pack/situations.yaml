- code: QD84.0
  title: Occupational exposure to dust
  group: QD80-QD8Z
  parent: QD84
  definition: Occupational exposure to dust is exposure to dust during work, at the work location, or from the work location.
    The primary route of exposure is inhalation. Dusts are technically defined as dry particle aerosols produced by mechanical
    processes such as breaking, grinding, and pulverizing. Dusts may be of biological or nonbiological origin.
