- code: QE50.7
  title: Personality difficulty
  group: QE50-QE5Z
  parent: QE50
  definition: Personality difficulty refers to pronounced personality characteristics that may affect treatment or health
    services but do not rise to the level of severity to merit a diagnosis of Personality disorder. Personality difficulty
    is characterised by long-standing difficulties (e.g., at least 2 years), in the individual’s way of experiencing and thinking
    about the self, others and the world. In contrast to Personality disorders, these difficulties are manifested in cognitive
    and emotional experience and expression only intermittently (e.g., during times of stress) or at low intensity. The difficulties
    are associated with some problems in functioning but these are insufficiently severe to cause notable disruption in social,
    occupational, and interpersonal relationships and may be limited to specific relationships or situations.
  definition_check: diff_verified
  inclusions: []
  exclusions:
  - title: Personality disorder
    code: 6D10
  coded_elsewhere: []
  index_terms:
